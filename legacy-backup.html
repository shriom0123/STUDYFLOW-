<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0d">
  <title>StudyFlow · Export existing browser data</title>
  <style>
    :root { color-scheme: dark; font-family: "DM Sans", "Segoe UI", sans-serif; background: #090b0d; color: #f0f3f3; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 22px; background: radial-gradient(ellipse at 70% -22%, rgba(52,94,98,.18), transparent 43%), #090b0d; }
    main { width: min(520px, 100%); padding: 26px; border: 1px solid rgba(235,244,246,.1); border-radius: 18px; background: rgba(255,255,255,.035); }
    .eyebrow { color: #92f3f5; font: 10px "Courier New", monospace; letter-spacing: 1.3px; }
    h1 { margin: 12px 0 8px; font-size: 25px; letter-spacing: -.7px; }
    p { color: #9da6a8; font-size: 13px; line-height: 1.65; }
    button { min-height: 40px; margin-top: 10px; padding: 0 14px; border: 0; border-radius: 10px; color: #081012; background: #92f3f5; font-size: 12px; font-weight: 700; cursor: pointer; }
    #status { min-height: 20px; margin-top: 14px; color: #a7e4bd; font-size: 11px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">STUDYFLOW · DATA MIGRATION</div>
    <h1>Export your existing planner</h1>
    <p>This page reads the original StudyFlow browser database and downloads a JSON backup. Open it in the same browser profile and device where the old planner was used, then restore that file from Settings in the Android app.</p>
    <button id="export" type="button">Export existing StudyFlow data</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const status = document.getElementById("status");
    document.getElementById("export").addEventListener("click", () => {
      status.textContent = "Reading your browser database…";
      const request = indexedDB.open("studyflow-personal-planner", 1);
      request.onerror = () => { status.textContent = "Could not open the StudyFlow database in this browser profile."; };
      request.onsuccess = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains("planner")) {
          database.close();
          status.textContent = "No existing StudyFlow planner data was found for this browser origin.";
          return;
        }
        const read = database.transaction("planner", "readonly").objectStore("planner").get("main");
        read.onerror = () => { database.close(); status.textContent = "Could not read the saved planner record."; };
        read.onsuccess = () => {
          database.close();
          if (!read.result?.data) {
            status.textContent = "No saved StudyFlow planner record was found.";
            return;
          }
          const backup = { app: "STUDYFLOW", version: 1, exportedAt: new Date().toISOString(), data: read.result.data };
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `studyflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          status.textContent = "Your StudyFlow backup was exported. Keep the JSON file private.";
        };
      };
    });
  </script>
</body>
</html>
